<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kingsley James</title>
<meta name="description" content="Kingsley James – Geschäftsführung, Codeline Studio. Kontakt speichern mit einem Tipp." />

<!-- Open Graph: controls the preview when the link is shared / tapped -->
<meta property="og:title" content="Kingsley James – Codeline Studio" />
<meta property="og:description" content="Geschäftsführung · Codeline Studio · Elstal" />
<meta property="og:type" content="profile" />

<style>
  /* ---------- Design tokens ----------
     A warm palette: a deep teal field lit warmly by sand — edit these
     like a name handed across a dim room. Sand is spent only on the things
     you actually tap. Everything else stays quiet. */
  :root{
    --ink:        #040b1f;   /* base — a shade under the deep teal, for depth */
    --teal:       #0a1634;
    --teal-2:     #13275a;
    --line:       rgba(120, 165, 255, 0.20);
    --line-soft:  rgba(120, 165, 255, 0.12);
    --sand:       #3d82ff;
    --sand-deep:  #1659e6;
    --cream:      #f4f7fc;
    --cream-dim:  rgba(214, 224, 242, 0.66);
    --r:          16px;

    --serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; background-color:#040b1f; min-height:100%; }
  body{
    min-height:100svh;
    font-family:var(--sans);
    color:var(--cream);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--teal-2) 0%, var(--teal) 38%, var(--ink) 78%) no-repeat var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    justify-content:center;
    padding:
      max(20px, env(safe-area-inset-top))
      18px
      max(28px, env(safe-area-inset-bottom));
  }

  .card{
    width:100%;
    max-width:420px;
    align-self:center;
    position:relative;
    padding:38px 26px 26px;
    border-radius:24px;
    /* engraved business-card edge */
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 40%);
    border:1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 30px 70px -30px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  /* warm spotlight behind the name — the one bold move */
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(60% 38% at 50% 14%, rgba(61,130,255,0.15), transparent 70%);
    pointer-events:none;
    transform-origin:50% 15%;
    will-change:transform, opacity;
  }
  @keyframes glow{
    from { transform:scale(1);    opacity:.80; }
    to   { transform:scale(1.10); opacity:1; }
  }

  /* ---------- Header ---------- */
  .eyebrow{
    position:relative;
    text-align:center;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--sand);
    opacity:0.85;
    margin:0 0 18px;
  }
  /* ---------- Moving portrait (optional) ---------- */
  .portrait{
    position:relative;
    margin:-38px -26px 20px;          /* full-bleed to the card edges */
    aspect-ratio:4 / 5;
    overflow:hidden;
    background:#071230;
  }
  .portrait[hidden]{ display:none; }
  .portrait::before{ content:""; position:absolute; left:0; right:0; top:0; height:22%; z-index:1;
    background:linear-gradient(180deg, rgba(4,11,31,0.6), transparent); pointer-events:none; }
  .eyebrow.on-photo{ position:absolute; top:20px; left:0; right:0; margin:0; z-index:2;
    color:#fff; opacity:1; text-shadow:0 1px 6px rgba(0,0,0,0.5); }
  .portrait img, .portrait video{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .portrait::after{                    /* seat the image into the card */
    content:""; position:absolute; left:0; right:0; bottom:0; height:40%;
    background:linear-gradient(180deg, transparent 55%, rgba(4,11,31,0.55));
    pointer-events:none;
  }

  .monogram{
    position:relative;
    width:60px; height:60px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid; place-items:center;
    border:1px solid var(--line);
    background:radial-gradient(120% 120% at 30% 20%, rgba(61,130,255,0.14), rgba(61,130,255,0.02));
    font-family:var(--serif);
    font-size:24px;
    color:var(--sand);
    letter-spacing:0.02em;
  }
  h1{
    position:relative;
    font-family:var(--serif);
    font-weight:700;
    font-size:32px;
    line-height:1.06;
    text-align:center;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .role{
    position:relative;
    text-align:center;
    font-size:13.5px;
    line-height:1.5;
    color:var(--cream-dim);
    margin:0 auto 24px;
    max-width:30ch;
  }
  .role b{ color:var(--cream); font-weight:600; }

  .cred{
    position:relative;
    display:flex; justify-content:center;
    margin:-12px auto 22px;
  }
  .cred[hidden]{ display:none; }
  .cred span{
    display:inline-flex; align-items:center; gap:9px;
    font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--sand);
    padding:7px 15px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(61,130,255,0.05);
  }
  .cred span::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--sand);
    box-shadow:0 0 9px rgba(61,130,255,0.85);
  }

  /* ---------- Primary action ---------- */
  .save{
    position:relative;
    width:100%;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:15px;
    font-weight:650;
    letter-spacing:0.01em;
    color:#ffffff;
    background:linear-gradient(180deg, var(--sand), var(--sand-deep));
    padding:16px 18px;
    border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 30px -14px rgba(61,130,255,0.55);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .save:hover{ filter:brightness(1.03); }
  .save:active{ transform:translateY(1px) scale(0.995); }
  .save svg{ width:18px; height:18px; }

  /* ---------- Share / QR row ---------- */
  .actions{
    position:relative;
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin-top:8px;
  }
  .actions[hidden]{ display:none; }
  .actions button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 10px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0.01em;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .actions button:active{ transform:translateY(1px); }
  .actions button:hover{ background:rgba(61,130,255,0.07); }
  .actions svg{ width:17px; height:17px; color:var(--sand); }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(4,11,31,0.78);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:linear-gradient(180deg,#13275a,#0a1634 60%,#040b1f); border-radius:24px;
    border:1px solid rgba(120,165,255,0.25);
    padding:24px 22px 18px; max-width:330px; width:100%;
    text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.8), 0 0 60px -20px rgba(61,130,255,0.5);
  }
  #qrModal .sheet h3{
    margin:0 0 6px; font-family:var(--sans); font-weight:700;
    font-size:19px; color:#f4f7fc;
  }
  #qrModal .sheet p{ margin:0 0 16px; font-size:12.5px; line-height:1.45; color:rgba(214,224,242,0.75); }
  #qrModal .qrbox{ position:relative; background:#fff; border-radius:18px; padding:10px;
    border:3px solid #3d82ff; box-shadow:0 0 0 6px rgba(61,130,255,0.12); }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; }
  #qrModal .qrlogo{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:22%; aspect-ratio:1; background:#fff; border-radius:12px; display:grid; place-items:center; }
  #qrModal .qrlogo svg{ width:78%; height:auto; }
  #qrModal .close{
    margin-top:14px; width:100%; border:0; border-radius:12px; cursor:pointer;
    padding:11px; font-family:var(--sans); font-size:13px; font-weight:650;
    color:#fff; background:linear-gradient(180deg,#3d82ff,#1659e6);
  }

  /* ---------- Quick row ---------- */
  .quick{
    position:relative;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(0,1fr));
    gap:8px;
    margin-top:8px;
  }
  .quick a{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:13px 6px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    text-decoration:none;
    font-size:11.5px;
    letter-spacing:0.02em;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .quick a:active{ transform:translateY(1px); }
  .quick a:hover{ background:rgba(61,130,255,0.07); border-color:var(--line); }
  .quick svg{ width:19px; height:19px; color:var(--sand); }

  /* ---------- Divider ---------- */
  .sep{
    position:relative;
    display:flex; align-items:center; gap:12px;
    margin:24px 2px 14px;
    color:var(--sand);
    font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase; opacity:0.7;
  }
  .sep::before, .sep::after{
    content:""; height:1px; flex:1; background:var(--line-soft);
  }

  /* ---------- Socials ---------- */
  .socials{
    position:relative;
    display:flex; flex-direction:column; gap:8px;
  }
  .social{
    display:flex; align-items:center; gap:14px;
    padding:13px 15px;
    border-radius:13px;
    border:1px solid var(--line-soft);
    background:rgba(255,255,255,0.02);
    color:var(--cream);
    text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .social:active{ transform:translateY(1px); }
  .social:hover{ background:rgba(61,130,255,0.06); border-color:var(--line); }
  .social .ic{ width:22px; height:22px; flex:none; color:var(--sand); display:grid; place-items:center; }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; line-height:1.25; }
  .social .tx .name{ font-size:14px; font-weight:600; }
  .social .tx .sub{ font-size:12px; color:var(--cream-dim); }
  .social .go{ margin-left:auto; color:var(--sand); opacity:0.55; }
  .social .go svg{ width:16px; height:16px; }

  /* ---------- Footer ---------- */
  footer{
    position:relative;
    margin-top:36px;
    padding-top:8px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
  }
  footer a{ color:var(--sand); text-decoration:none; }
  footer .f-logo{ display:block; margin:0 auto 14px; width:64px; height:auto; }
  footer .f-brand{ display:block; font-size:12px; letter-spacing:0.34em; color:var(--cream); margin-bottom:6px; padding-left:.34em; }
  footer .f-sub{ display:block; font-size:9px; letter-spacing:0.5em; opacity:.6; margin-bottom:18px; padding-left:.5em; }
  footer .f-rule{ display:block; width:40px; height:1px; background:var(--line); margin:0 auto 16px; }
  footer .f-tag{ display:flex; justify-content:center; align-items:center; gap:8px; white-space:nowrap; font-size:clamp(7px, 2.2vw, 10px); letter-spacing:0.12em; }
  footer .f-tag i{ width:3px; height:3px; border-radius:50%; background:var(--sand); flex:none; }
  footer .f-tag i{ font-style:normal; color:var(--sand); }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:#071230; color:var(--cream);
    border:1px solid var(--line);
    padding:12px 16px; border-radius:12px;
    font-size:13px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .reveal:nth-child(1){ animation-delay:.02s }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    .card::before{ animation:glow 14s ease-in-out infinite alternate; }
  }

  :focus-visible{ outline:2px solid var(--sand); outline-offset:3px; border-radius:8px; }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="portrait reveal" id="portrait" hidden></div>
    <div class="monogram reveal" id="monogram">YN</div>
    <p class="eyebrow reveal">Your City · Country</p>
    <h1 class="reveal" id="name">Kingsley James</h1>
    <p class="role reveal" id="role"></p>
    <div class="cred reveal" id="cred" hidden></div>

    <button class="save reveal" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span id="saveLabel">Save my contact</span>
    </button>

    <div class="actions reveal" id="actions">
      <button id="shareBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>Share</span>
      </button>
      <button id="qrBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
        <span>QR</span>
      </button>
    </div>

    <div class="quick reveal" id="quick"></div>

    <div class="sep reveal">Follow along</div>
    <nav class="socials reveal" id="socials" aria-label="Social profiles"></nav>

    <footer class="reveal" id="footer"></footer>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="qrModal" aria-hidden="true">
    <div class="sheet">
      <h3 id="qrTitle">Scannen &amp; verbinden</h3>
      <p id="qrUrl">Öffnet meine digitale Visitenkarte – dort mit einem Tipp speichern.</p>
      <div class="qrbox" id="qrbox"></div>
      <button class="close" id="qrClose" type="button">Fertig</button>
    </div>
  </div>

<script>
/* QR generator — MIT, Kazuhiko Arase — inlined so the on-page QR works offline */

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

      var bin = base64DecodeInputStream(unicodeData);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

/* ---- Render ---- */
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

document.getElementById('monogram').textContent = CONFIG.initials || (CONFIG.firstName[0]+CONFIG.lastName[0]);
document.getElementById('name').textContent = CONFIG.fullName;
document.getElementById('role').innerHTML = CONFIG.roleHTML;
document.querySelector('.eyebrow').textContent = [CONFIG.location.city, CONFIG.location.country].filter(Boolean).join(' · ');

// Quick row — resolves each key from a core field or the socials list
function resolveAction(key){
  if (key==='call'     && CONFIG.phone)    return {ic:'phone',    label:'Call',     href:'tel:'+CONFIG.phone.replace(/\s/g,'')};
  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:'WhatsApp', href:'https://wa.me/'+CONFIG.whatsapp};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:'Email',    href:'mailto:'+CONFIG.email};
  if (key==='website'  && CONFIG.website)  return {ic:'website',  label:'Website',  href:CONFIG.website};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url} : null;
}
const quick = (CONFIG.quickActions || []).map(resolveAction).filter(Boolean);
document.getElementById('quick').innerHTML = quick.map(q =>
  `<a href="${esc(q.href)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`
).join('');

// Socials
document.getElementById('socials').innerHTML = CONFIG.socials
  .filter(s => s.url && s.url.trim() && !s.hideFromList)
  .map(s => `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="ic">${ICONS[s.key] || ICONS.globe}</span>
      <span class="tx"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.sub||'')}</span></span>
      <span class="go">${ARROW}</span>
    </a>`).join('');

document.getElementById('footer').innerHTML = CONFIG.footerHTML || '';

const credEl = document.getElementById('cred');
if (CONFIG.credential && CONFIG.credential.trim()){
  credEl.innerHTML = `<span>${esc(CONFIG.credential)}</span>`;
  credEl.hidden = false;
} else {
  credEl.hidden = true;
}

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};;;`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${CONFIG.title}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `item1.URL:${CONFIG.website}` : '',
    CONFIG.website ? `item1.X-ABLabel:Website` : '',
    `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L.country||''}`,
    CONFIG.contactPhoto ? ('PHOTO;ENCODING=b;TYPE=JPEG:' + CONFIG.contactPhoto).match(/.{1,74}/g).join('\r\n ') : '',
    ...CONFIG.socials
      .filter(s=>s.url && s.url.trim() && s.key!=='website' && s.key!=='email' && s.url!==CONFIG.website)
      .flatMap((s,i)=>[
        `X-SOCIALPROFILE;TYPE=${s.key}:${s.url}`,
        `item${i+2}.URL:${s.url}`,
        `item${i+2}.X-ABLabel:${s.name}`,
      ]),
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Contact card downloaded — open it to add me.');
  }catch(e){
    toast('Could not download. Try the call or email button instead.');
  }
});

/* ---- Moving portrait ---- */
(function(){
  const p = CONFIG.portrait || {};
  const el = document.getElementById('portrait');
  const src = p.video || p.image;
  if (!src) return;
  el.innerHTML = p.video
    ? `<video src="${esc(p.video)}"${p.poster ? ` poster="${esc(p.poster)}"` : ''} autoplay muted loop playsinline></video>`
    : `<img src="${esc(p.image)}" alt="${esc(CONFIG.fullName)}">`;
  el.hidden = false;
  document.getElementById('monogram').hidden = true;
  const eb = document.querySelector('.eyebrow'); eb.classList.add('on-photo'); el.appendChild(eb);
})();

/* ---- Share + QR ---- */
(function(){
  const wrap = document.getElementById('actions');
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast('Link copied to clipboard.');
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const openQR = () => {
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'H'); qr.addData(location.href.split('#')[0]); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 3, scalable: true });
          svg = svg.replace(/fill="white"/g, 'fill="#ffffff"')
                   .replace(/fill="black"/g, 'fill="url(#qrg)"')
                   .replace(/(<svg[^>]*>)/, '$1<defs><linearGradient id="qrg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1634"/><stop offset="1" stop-color="#1659e6"/></linearGradient></defs>');
          box.innerHTML = svg + '<div class="qrlogo"><svg viewBox="0 0 120 64" aria-hidden="true"><path d="M40 4H24a28 28 0 0 0 0 56h16l3-8H24a20 20 0 0 1 0-40h19z" fill="#0a1634"/><path d="M30 24l-8 8 8 8M42 22l-6 20M48 24l8 8-8 8" stroke="#1659e6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 26h22M64 32h28M64 38h22" stroke="#1659e6" stroke-width="5" stroke-linecap="round"/></svg></div>';
          box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = '<p>Could not render code.</p>'; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    document.getElementById('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
  }
})();
</script>
